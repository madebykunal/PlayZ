<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Pixel Runner</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common/game-shell.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-game-title="Pixel Runner">
    <div class="playz-game-box" id="pixel-runner-box">
        <div id="start-screen">
            <h1>PIXEL RUNNER</h1>
            <button id="start-button">START</button>
        </div>

        <div id="game-container">
        <div id="score">0000</div>
        <canvas id="game-canvas"></canvas>
        <div id="game-over">
            <h1>GAME OVER</h1>
            <div id="final-score">0000</div>
            <button id="restart-button">RETRY</button>
        </div>
    </div>

    
    </div>
    <script src="../common/game-shell.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
