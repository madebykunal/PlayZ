<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dodger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common/game-shell.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-game-title="Pixel Dodger">
    <div class="playz-game-box" id="dodger-box">
        <div id="start-screen">
            Pixel Dodger
            <button id="start-button">Start Game</button>
        </div>

        <div id="score">Score: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div id="game-over-screen">
            Game Over!
            <div id="final-score" class="mt-4">Final Score: 0</div>
            <button id="restart-button">Restart</button>
        </div>

        <div id="touch-controls-hint">Tap left/right side of screen to move</div>
    </div>

    <script src="../common/game-shell.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
